name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "love_system.py"
      - "app_parts/**"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Gerar executavel
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LoveSystem --collect-all webview --add-data "app_parts;app_parts" --add-data "assets/camera.webp;assets" --add-data "assets/trio.webp;assets" --add-data "assets/dexter.webp;assets" --add-data "assets/uno.png;assets" love_system.py

      - name: Publicar LoveSystem.exe
        uses: actions/upload-artifact@v4
        with:
          name: LoveSystem-Windows
          path: dist/LoveSystem.exe
          if-no-files-found: error
